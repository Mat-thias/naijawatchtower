{% extends "base.html" %}
{% block title %}{{ t('web.upload.title') }}{% endblock %}
{% block content %}
<h1>{{ t('web.upload.title') }}</h1>
<p class="lede">{{ t('web.upload.intro') }}</p>
{% if error %}<p class="rule" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/upload" enctype="multipart/form-data" class="card">
  <p><label for="pu">{{ t('web.upload.unit') }}</label><br>
    <select id="pu" name="pu_code" required>
      {% for u in units %}<option value="{{ u.code }}">{{ u.numeric_code }} · {{ u.name }} · {{ u.state_name }}{% if u.waiting %} ({{ t('web.upload.waiting') }}){% endif %}</option>{% endfor %}
    </select></p>
  <p><label for="file">{{ t('web.upload.file') }}</label><br><input id="file" name="file" type="file" accept="image/jpeg,image/png" required></p>
  <button type="submit">{{ t('web.upload.submit') }}</button>
</form>
{% endblock %}
